{{define "content"}}
<h2>Список трат</h2>
<table>
    <tr><th>ID</th><th>Сумма</th><th>Описание</th><th>Дата</th></tr>
    {{range .}}
    <tr>
        <td>{{.ID}}</td>
        <td>{{.Amount}}</td>
        <td>{{.Description}}</td>
        <td>{{.Date}}</td>
    </tr>
    {{end}}
</table>

<h2>Добавить трату</h2>
<form method="POST" action="/expenses/add">
    <p>Сумма: <input type="number" step="0.01" name="amount" required></p>
    <p>Описание: <input type="text" name="description" required></p>
    <p>Дата: <input type="date" name="date" required></p>
    <button type="submit">Добавить</button>
</form>
{{end}}
