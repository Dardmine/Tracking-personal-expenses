{{define "edit_content"}}
<h2>Редактировать трату</h2>
<form method="POST" action="/expenses/update">
    <input type="hidden" name="id" value="{{.Expense.ID}}">
    <p>Сумма: <input type="number" step="0.01" name="amount" value="{{.Expense.Amount}}" required></p>
    <p>Описание: <input type="text" name="description" value="{{.Expense.Description}}" required></p>
    <p>Дата: <input type="date" name="date" value="{{.Expense.Date}}" required></p>
    <p>Категория:
        <select name="category_id">
            {{range .Categories}}
                <option value="{{.ID}}" {{if eq .ID $.Expense.CategoryID}}selected{{end}}>{{.Name}}</option>
            {{end}}
        </select>
    </p>
    <button type="submit">Сохранить</button>
</form>
<a href="/expenses">Отмена</a>
{{end}}
